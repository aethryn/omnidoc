# Robin AI Code Review workflow (https://robinreview.dev)
# Configure the following repository secrets in GitHub Settings -> Secrets and variables -> Actions:
# - LLM_API_KEY: Your OpenRouter API key (e.g. sk-or-v1-...)
# - LLM_BASE_URL: https://openrouter.ai/api/v1
# - LLM_MODEL: Desired model name (e.g. google/gemini-2.5-flash, deepseek/deepseek-chat, anthropic/claude-3.5-sonnet, or openrouter/free)
name: Robin

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: antongulin/robin/.github/workflows/review.yml@main
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}

