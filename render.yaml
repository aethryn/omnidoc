services:
  - type: web
    name: omnidoc-collaboration
    runtime: node
    region: singapore
    buildCommand: npm ci --ignore-scripts && npx prisma generate
    startCommand: npm run ws:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AI_CREDENTIALS_ENCRYPTION_KEY
        sync: false
